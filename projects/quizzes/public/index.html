/* Herada design system (v3 palette, Oct 2026), inlined so this page stands alone. */
:root {
  --bg: #FDFCFE;
  --strip: #B7B5E4;
  --ink: #2B2733;
  --ink-soft: #5B5666;
  --accent: #AD1457;
  --accent-hover: #8A0E45;
  --accent-ink: #FDFCFE;
  --rule: #CFCCD6;
  --kicker: #6B68A0;
  --display: "Bricolage Grotesque", "Segoe UI", Helvetica, Arial, sans-serif;
  --body: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --ui: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --page: 48rem;
  --gutter: clamp(1rem, 4vw, 2rem);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #211E28; --strip: #34304A; --ink: #FDFCFE; --ink-soft: #BBC2E2;
    --accent: #F08DB5; --accent-hover: #F6B3CE; --accent-ink: #211E28; --rule: #45405A;
    --kicker: #B7B5E4;
  }
}
:root[data-theme="dark"] {
  --bg: #211E28; --strip: #34304A; --ink: #FDFCFE; --ink-soft: #BBC2E2;
  --accent: #F08DB5; --accent-hover: #F6B3CE; --accent-ink: #211E28; --rule: #45405A;
  --kicker: #B7B5E4;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: flex; flex-direction: column;
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 1.1875rem; line-height: 1.55;
}
main { flex: 1 0 auto; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2.5rem, 6.5vw, 3.75rem); letter-spacing: -0.02em; }
h2 { font-size: clamp(1.5rem, 3.5vw, 2rem); letter-spacing: -0.015em; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 0.18em; }
a:hover { color: var(--accent-hover); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.hr-wrap { max-width: var(--page); margin: 0 auto; padding: 0 var(--gutter); }
.hr-ui { font-family: var(--ui); font-size: 0.875rem; }

.hr-header { border-bottom: 1px solid var(--rule); }
.hr-header .hr-wrap { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0.5rem 2rem; padding-top: 1.1rem; padding-bottom: 1.1rem; }
.hr-wordmark { font-family: var(--display); font-size: 1.375rem; font-weight: 500; letter-spacing: 0.14em; color: var(--accent); text-decoration: none; }
.hr-header span.hr-ui { color: var(--ink-soft); }

.hr-notice { background: var(--strip); }
.hr-notice p { padding: 0.8rem 0; font-family: var(--ui); font-size: 0.9375rem; color: var(--ink); }

.qz-kicker { font-family: var(--ui); font-size: 1rem; font-weight: 700; letter-spacing: 0; color: var(--ink); }
.qz-kicker::before { content: "["; color: var(--accent); }
.qz-kicker::after { content: "]"; color: var(--accent); }

/* Hub */
.qz-hub { padding: clamp(2.5rem, 7vw, 4.5rem) 0; }
.qz-lede { max-width: 44rem; margin-top: 1.25rem; font-size: 1.25rem; line-height: 1.5; color: var(--ink-soft); }
.qz-cards { margin-top: 2.5rem; }
.qz-card { display: block; width: 100%; text-align: left; padding: 1.75rem 0; border: none; border-top: 3px solid var(--ink); background: none; cursor: pointer; font-family: var(--body); color: var(--ink); }
.qz-card:last-child { border-bottom: 1px solid var(--rule); }
.qz-card:hover h2 { color: var(--accent); }
.qz-card .qz-meta { font-family: var(--ui); font-size: 0.875rem; font-weight: 700; color: var(--ink); }
.qz-card .qz-meta::before { content: "["; color: var(--accent); }
.qz-card .qz-meta::after { content: "]"; color: var(--accent); }
.qz-card h2 { margin-top: 0.3rem; }
.qz-card p { margin-top: 0.4rem; font-size: 1.0625rem; color: var(--ink-soft); max-width: 44rem; }
.qz-go { display: inline-block; margin-top: 0.6rem; font-family: var(--ui); font-size: 0.9375rem; font-weight: 600; color: var(--accent); }
.qz-card:hover .qz-go { color: var(--accent-hover); }
.qz-card.qz-soon { cursor: default; }
.qz-card.qz-soon:hover h2 { color: var(--ink); }
.qz-card.qz-soon h2, .qz-card.qz-soon p { opacity: 0.55; }

/* Quiz play */
.qz-play { padding: clamp(2rem, 6vw, 3.5rem) 0; }
.qz-top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
.qz-back { font-family: var(--ui); font-size: 0.875rem; font-weight: 600; background: none; border: none; color: var(--ink-soft); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 0.18em; }
.qz-back:hover { color: var(--accent); }
.qz-progress { font-family: var(--ui); font-size: 0.875rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.qz-bar { margin-top: 0.75rem; height: 2px; background: var(--rule); }
.qz-bar span { display: block; height: 2px; background: var(--accent); }
.qz-question { margin-top: clamp(2rem, 6vw, 3rem); font-family: var(--display); font-weight: 600; font-size: clamp(1.5rem, 4.5vw, 2.25rem); line-height: 1.2; letter-spacing: -0.015em; max-width: 26ch; }
.qz-qnote { margin-top: 0.75rem; font-family: var(--ui); font-size: 0.9375rem; color: var(--ink-soft); max-width: 36rem; }
.qz-options { margin-top: 1.75rem; display: grid; gap: 0.75rem; max-width: 40rem; }
.qz-options button {
  text-align: left; font-family: var(--body); font-size: 1.0625rem; line-height: 1.4; color: var(--ink);
  background: transparent; border: 1px solid var(--rule); border-radius: 2px;
  padding: 0.9rem 1.1rem; cursor: pointer; min-height: 3rem;
}
.qz-options button:hover { border-color: var(--accent); color: var(--accent); }

/* Reveal */
.qz-reveal { margin-top: 1.75rem; max-width: 40rem; border-top: 2px solid var(--ink); padding-top: 1rem; }
.qz-verdict { font-family: var(--display); font-weight: 600; font-size: 1.375rem; }
.qz-verdict.good { color: var(--accent); }
.qz-reveal p { margin-top: 0.6rem; font-size: 1.0625rem; color: var(--ink-soft); }
.qz-src { margin-top: 0.75rem; font-family: var(--ui); font-size: 0.8125rem; color: var(--ink-soft); }
.hr-button {
  display: inline-block; padding: 0.8rem 1.6rem; background: var(--accent); color: var(--accent-ink);
  border: none; border-radius: 2px; font-family: var(--ui); font-size: 1rem; font-weight: 600;
  text-decoration: none; cursor: pointer; margin-top: 1.5rem;
}
.hr-button:hover { background: var(--accent-hover); color: var(--accent-ink); }

/* Result */
.qz-result { margin-top: clamp(2rem, 6vw, 3rem); border: 2px solid var(--ink); padding: clamp(1.5rem, 5vw, 2.5rem); max-width: 42rem; }
.qz-result .qz-kicker { color: var(--kicker); }
.qz-result h2 { margin-top: 0.5rem; font-size: clamp(1.75rem, 5vw, 2.5rem); color: var(--accent); }
.qz-result .qz-big { font-family: var(--display); font-weight: 600; font-size: clamp(2.5rem, 9vw, 4rem); line-height: 1; color: var(--accent); margin-top: 0.5rem; }
.qz-result p { margin-top: 0.9rem; font-size: 1.0625rem; color: var(--ink-soft); }
.qz-result .qz-strength b, .qz-result .qz-watch b { color: var(--ink); font-weight: 600; }
.qz-scripts { margin: 1.25rem 0 0; padding: 0; list-style: none; }
.qz-scripts li { padding: 0.7rem 0; border-top: 1px solid var(--rule); font-family: var(--display); font-weight: 500; font-size: 1.125rem; }
.qz-scripts li::before { content: "\201C"; color: var(--accent); }
.qz-scripts li::after { content: "\201D"; color: var(--accent); }
.qz-cta { margin-top: 1.25rem; font-size: 1rem; }
.qz-result-actions { display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; align-items: center; margin-top: 1.5rem; }
.qz-ghost {
  display: inline-block; padding: 0.7rem 1.3rem; background: transparent; color: var(--ink);
  border: 1px solid var(--ink); border-radius: 2px; font-family: var(--ui); font-size: 0.9375rem; font-weight: 600; cursor: pointer;
}
.qz-ghost:hover { border-color: var(--accent); color: var(--accent); }
.qz-copied { font-family: var(--ui); font-size: 0.9375rem; color: var(--ink-soft); }
.qz-note { margin-top: 1.5rem; max-width: 40rem; font-family: var(--ui); font-size: 0.875rem; color: var(--ink-soft); }

.hr-footer { border-top: 1px solid var(--rule); padding: 1.5rem 0 2rem; color: var(--ink-soft); }
</style>
</head>

      { q: "“Perimenopause brain fog is all in your head.”",
        answer: 1, verdict: "It’s measurable, and it lifts.",
        why: "In 2,362 SWAN women tested yearly, scores for processing speed and verbal memory kept improving with practice before and after the transition but stalled during perimenopause: processing speed in the late stage, verbal memory in both. The dip was small and temporary, and performance recovered once women were postmenopausal.",
        src: "Greendale et al., SWAN, Neurology 2009", url: "https://doi.org/10.1212/WNL.0b013e3181a71193" },
      { q: "“The risk of a first depression rises during the transition.”",
        answer: 0, verdict: "It does: about double.",
        why: "The Harvard Study of Moods and Cycles followed 460 women aged 36 to 45 with no history of major depression. Those who entered perimenopause were twice as likely to develop significant depressive symptoms as those who stayed premenopausal, and the risk was higher again with hot flashes. New low mood in your forties deserves the same attention as anything else on this list.",
        src: "Cohen et al., Archives of General Psychiatry 2006", url: "https://doi.org/10.1001/archpsyc.63.4.385" },
      { q: "“Once your periods are irregular, you can’t get pregnant.”",
        answer: 1, verdict: "Ovulation still happens, unpredictably.",
        why: "Fertility falls through the forties but doesn’t reach zero until menopause is confirmed. UK guidance: keep using contraception until two years after your last natural period if you’re under 50, and one year after it if you’re over 50. Bleeds on hormone therapy don’t count as periods for this.",
        src: "FSRH guideline, Contraception for Women Aged over 40 Years (2017, amended 2023)", url: "https://fsrh.org/Common/Uploaded%20files/documents/fsrh-guideline-contraception-for-women-aged-over-40-years-august-2017-amended-july-2023-.pdf" },
      { q: "“Menopausal hormone therapy is too risky for most women to consider.”",
        answer: 1, verdict: "Timing is the point, not a blanket no.",
        why: "The Menopause Society’s 2022 position statement: for women under 60 or within ten years of their last period who have bothersome hot flashes and no contraindications, the benefits of hormone therapy outweigh the risks. Starting later carries more risk. Dose, type, route and your own history all matter, which makes it a conversation, not a blanket yes or no.",
        src: "The 2022 Hormone Therapy Position Statement of The North American Menopause Society, Menopause 2022", url: "https://doi.org/10.1097/GME.0000000000002028" },
      { q: "“Vaginal estrogen for dryness carries the same risks as hormone therapy pills.”",
        answer: 1, verdict: "It acts locally, with minimal absorption.",
        why: "Low-dose vaginal estrogen treats dryness, pain with sex and recurrent urinary symptoms where they happen, with far less reaching the bloodstream than systemic therapy. The Menopause Society’s position statement makes it the first-line prescription treatment for these symptoms, and NICE recommends it for as long as it helps, including for women already on systemic HRT, without routine endometrial monitoring. Symptoms tend to return when it stops.",
        src: "The 2020 Genitourinary Syndrome of Menopause Position Statement of The North American Menopause Society, Menopause 2020", url: "https://doi.org/10.1097/GME.0000000000001609" },
      { q: "“Any bleeding after twelve months without a period needs checking.”",
        answer: 0, verdict: "It does: every time.",
        why: "Bleeding after menopause is usually benign, but it is the main warning sign of endometrial cancer, so it earns an evaluation every time. ACOG’s 2026 update asks for a transvaginal ultrasound plus a tissue sample as the first step for most patients; ultrasound alone is kept for a single episode with a thin, fully seen lining and no strong risk factors, partly because aggressive cancers that disproportionately affect Black women can hide behind a thin lining. Heavy or unpredictable bleeding during perimenopause is common too, and worth raising when it is new, very heavy or between cycles.",
        src: "ACOG Clinical Practice Update, Obstetrics & Gynecology 2026", url: "https://doi.org/10.1097/AOG.0000000000006275" },
      { q: "“Fatigue, weight gain and mood swings in your forties are perimenopause. Case closed.”",
        answer: 1, verdict: "Thyroid disease wears the same symptoms.",
        why: "An underactive or overactive thyroid brings cycle changes, mood shifts, sweats, sleep trouble and hair change: the perimenopause checklist, almost line for line. European menopause guidance treats the thyroid as part of telling them apart, so a TSH with free T4 belongs in the conversation before the label settles. The Ledger’s look-alikes map carries the rest of the list.",
        src: "EMAS position statement on thyroid disease and menopause, Maturitas 2024", url: "https://emas-online.org/wp-content/uploads/2024/04/PIIS0378512224000860.pdf" }
    ]
  };

  var QUIZZES = [MYTH, STYLE, PERI];
  var COMING = [
    { title: "How complete was your workup?", meta: "Coming soon · will ship after clinical review" },
    { title: "Who should I actually see?", meta: "Coming soon · will ship after clinical review" }
  ];

  var app = document.getElementById("app");
  var state = null;

  // ---------- Hub ----------
  function renderHub() {
    state = null;
    var out = ['<div class="qz-hub"><p class="qz-kicker">Pop quiz</p><h1>Tap through. Learn something. Keep the receipts.</h1>',
      '<p class="qz-lede">Quizzes in women’s health that respect your intelligence. Nothing stored + every reveal sourced.</p>',
      '<div class="qz-cards">'];
    QUIZZES.forEach(function (qz) {
      out.push('<button type="button" class="qz-card" data-quiz="' + qz.id + '"><span class="qz-meta">' + esc(qz.meta) + "</span><h2>" + esc(qz.title) + "</h2><p>" + esc(qz.blurb) + '</p><span class="qz-go">Play →</span></button>');
    });
    COMING.forEach(function (c) {
      out.push('<div class="qz-card qz-soon"><span class="qz-meta">' + esc(c.meta) + "</span><h2>" + esc(c.title) + "</h2></div>");
    });
    out.push("</div></div>");
    app.innerHTML = out.join("");
  }

  // ---------- Play ----------
  function startQuiz(qz) {
    state = { quiz: qz, i: 0, score: 0, tally: {}, revealed: false };
    renderQuestion();
  }

  function chrome(innerHtml) {
    var qz = state.quiz;
    var total = qz.questions.length;
    // The bar fills per answered question, so it advances during a reveal.
    var answered = Math.min(state.i + (state.revealed ? 1 : 0), total);
    var label = Math.min(state.i + 1, total);
    return '<div class="qz-play"><div class="qz-top"><button type="button" class="qz-back" id="backHub">← All quizzes</button>' +
      '<span class="qz-progress">' + label + " / " + total + "</span></div>" +
      '<div class="qz-bar"><span style="width:' + (answered / total * 100) + '%"></span></div>' + innerHtml + "</div>";
  }

  function renderQuestion() {
    state.revealed = false;
    var qz = state.quiz;
    var q = qz.questions[state.i];
    var out = ['<h1 class="qz-kicker" style="margin-top:2rem">' + esc(qz.title) + '</h1><h2 class="qz-question">' + q.q + "</h2>"];
    out.push('<div class="qz-options">');
    if (qz.kind === "graded") {
      qz.optionsLabels.forEach(function (label, oi) {
        out.push('<button type="button" data-pick="' + oi + '">' + esc(label) + "</button>");
      });
    } else {
      q.opts.forEach(function (o, oi) {
        out.push('<button type="button" data-pick="' + oi + '">' + esc(o[0]) + "</button>");
      });
    }
    out.push("</div>");
    app.innerHTML = chrome(out.join(""));
  }

  function renderReveal(pick) {
    state.revealed = true;
    var qz = state.quiz;
    var q = qz.questions[state.i];
    var correct = pick === q.answer;
    if (correct) state.score++;
    var out = ['<h1 class="qz-kicker" style="margin-top:2rem">' + esc(qz.title) + '</h1><h2 class="qz-question">' + q.q + "</h2>"];
    out.push('<div class="qz-reveal"><p class="qz-verdict' + (correct ? " good" : "") + '">' + (correct ? "You called it. " : "Not quite. ") + esc(q.verdict) + "</p>");
    out.push("<p>" + esc(q.why) + "</p>");
    out.push('<p class="qz-src">Source: <a href="' + esc(q.url) + '">' + esc(q.src) + "</a></p></div>");
    out.push('<button type="button" class="hr-button" id="nextQ">' + (state.i + 1 < qz.questions.length ? "Next round" : "See my result") + "</button>");
    app.innerHTML = chrome(out.join(""));
  }

  function renderResult() {
    var qz = state.quiz;
    var out = [];
    if (qz.kind === "graded") {
      var total = qz.questions.length;
      var line = qz.scoreLines[0][1];
      qz.scoreLines.forEach(function (sl) { if (state.score >= sl[0]) line = sl[1]; });
      out.push('<div class="qz-result"><h1 class="qz-kicker">Your result</h1>');
      out.push('<p class="qz-big">' + state.score + " / " + total + "</p>");
      out.push("<p><b>" + esc(line) + "</b></p>");
      out.push("<p>" + qz.resultNote + "</p>");
      out.push(resultActions(qz.shareLine.replace("{score}", state.score).replace("{total}", total)));
      out.push("</div>");
    } else {
      var best = Object.keys(qz.results).sort(function (a, b) { return (state.tally[b] || 0) - (state.tally[a] || 0); })[0];
      var r = qz.results[best];
      out.push('<div class="qz-result"><h1 class="qz-kicker">Your exam-room archetype</h1>');
      out.push("<h2>" + esc(r.name) + "</h2>");
      out.push("<p>" + esc(r.desc) + "</p>");
      out.push('<p class="qz-strength"><b>' + esc(r.strength) + "</b></p>");
      out.push('<p class="qz-watch">' + esc(r.watch) + "</p>");
      out.push('<ul class="qz-scripts">' + r.scripts.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ul>");
      out.push('<p class="qz-cta">' + r.cta + "</p>");
      out.push(resultActions("My exam-room archetype: " + r.name + ". Find yours: joinherada.com/projects/quizzes/"));
      out.push("</div>");
      out.push('<p class="qz-note">This is a communication-style quiz. It knows nothing about your health, and all four archetypes get taken seriously in a good exam room.</p>');
    }
    app.innerHTML = chrome(out.join(""));
  }

  function resultActions(copyText) {
    return '<div class="qz-result-actions"><button type="button" class="qz-ghost" id="copyResult" data-copy="' + esc(copyText) + '">Copy my result</button>' +
      '<button type="button" class="qz-ghost" id="retake">Retake</button>' +
      '<span class="qz-copied" id="copied" hidden>Copied!</span></div>';
  }

  // ---------- Events ----------
  app.addEventListener("click", function (ev) {
    var t = ev.target;
    var card = t.closest ? t.closest("button.qz-card[data-quiz]") : null;
    if (card) {
      var qz = QUIZZES.find(function (z) { return z.id === card.getAttribute("data-quiz"); });
      if (qz) startQuiz(qz);
      return;
    }
    if (t.closest && t.closest("#backHub")) { renderHub(); window.scrollTo(0, 0); return; }
    var pickBtn = t.closest ? t.closest(".qz-options button[data-pick]") : null;
    if (pickBtn && state) {
      var pick = +pickBtn.getAttribute("data-pick");
      if (state.quiz.kind === "graded") {
        renderReveal(pick);
      } else {
        var key = state.quiz.questions[state.i].opts[pick][1];
        state.tally[key] = (state.tally[key] || 0) + 1;
        state.i++;
        if (state.i < state.quiz.questions.length) renderQuestion(); else renderResult();
        window.scrollTo(0, 0);
      }
      return;
    }
    if (t.closest && t.closest("#nextQ") && state) {
      state.i++;
      if (state.i < state.quiz.questions.length) renderQuestion(); else renderResult();
      window.scrollTo(0, 0);
      return;
    }
    if (t.closest && t.closest("#retake") && state) { startQuiz(state.quiz); window.scrollTo(0, 0); return; }
    var copyBtn = t.closest ? t.closest("#copyResult") : null;
    if (copyBtn) {
      var text = copyBtn.getAttribute("data-copy");
      var note = document.getElementById("copied");
      function done() { if (note) { note.hidden = false; setTimeout(function () { note.hidden = true; }, 3000); } }
      function fallback() {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); done(); } catch (err) { /* shrug */ }
        ta.remove();
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, fallback);
      } else { fallback(); }
    }
  });

  renderHub();
})();
</script>
</body>
</html>
