.bp-form { display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; align-items: flex-end; margin-top: 1.5rem; }
.bp-field { display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; }
.bp-field > span { font-family: var(--ui); font-size: 0.8125rem; font-weight: 600; color: var(--ink-soft); }

}
input:hover, select:hover { border-color: var(--ink-soft); }

select { min-width: 14rem; max-width: 100%; }
.hr-button {
  display: inline-block; padding: 0.8rem 1.4rem; background: var(--accent); color: var(--accent-ink);

.bp-ghost {
  display: inline-block; padding: 0.75rem 1.35rem; background: transparent; color: var(--ink);

.bp-hint { margin-top: 0.9rem; font-family: var(--ui); font-size: 0.8125rem; color: var(--ink-soft); max-width: 44rem; }

.bp-meta span { display: block; font-family: var(--ui); font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.85; }
.bp-meta b { display: block; font-family: var(--display); font-size: 1.125rem; font-weight: 600; margin-top: 0.1rem; }
.bp-body { padding: 0.5rem 1.4rem 1.4rem; }
.bp-group { margin-top: 1.5rem; }
.bp-group h3 { font-family: var(--ui); font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--kicker); }
.bp-group h3::before { content: "["; color: var(--accent); margin-right: 0.15rem; }
.bp-group h3::after { content: "]"; color: var(--accent); margin-left: 0.15rem; }
.bp-items { margin: 0.5rem 0 0; padding: 0; list-style: none; }
.bp-items li { padding: 1rem 0; border-top: 1px solid var(--rule); }
.bp-items li:last-child { border-bottom: 1px solid var(--rule); }
.bp-item-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0.25rem 1rem; }
.bp-item-head b { font-family: var(--display); font-size: 1.1875rem; font-weight: 600; }
.bp-when { font-family: var(--ui); font-size: 0.8125rem; font-weight: 600; color: var(--kicker); letter-spacing: 0.04em; }
.bp-what { margin-top: 0.4rem; font-size: 1rem; color: var(--ink-soft); max-width: 40rem; }

.bp-src { display: block; margin-top: 0.3rem; font-family: var(--ui); font-size: 0.75rem; color: var(--ink-soft); }

.bp-also { margin: 0.6rem 0 0; padding: 0; list-style: none; }

.bp-also li:last-child { border-bottom: 1px solid var(--rule); }
.bp-also b { font-weight: 600; }
.bp-also .bp-when { font-size: 0.75rem; }
.bp-also .bp-say { margin: 0; flex-basis: 100%; font-size: 0.875rem; }
.bp-also .bp-src { flex-basis: 100%; margin-top: 0.1rem; }
.bp-foot { margin-top: 1.5rem; padding-top: 0.75rem; border-top: 2px solid var(--ink); font-family: var(--ui); font-size: 0.75rem; color: var(--ink-soft); }

.bp-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.9rem 1.5rem; margin-top: 1.5rem; }
.bp-plannote { margin-top: 1.25rem; max-width: 46rem; padding: 0.9rem 1.1rem; border: 1px solid var(--rule); font-family: var(--ui); font-size: 0.9375rem; color: var(--ink-soft); }
.bp-plannote b { color: var(--ink); font-weight: 600; }

/* The EOB reader: text only, in the page only. */
textarea { width: 100%; max-width: 46rem; min-height: 11rem; resize: vertical; font-family: var(--ui); font-size: 0.9375rem; color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: 2px; padding: 0.65rem 0.75rem; margin-top: 1rem; }

.bp-eobout { margin-top: 1.5rem; max-width: 46rem; }

.bp-flag .bp-tag.soft { border-color: var(--kicker); color: var(--kicker); }
.bp-flag .bp-line { display: block; margin-top: 0.3rem; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.8125rem; color: var(--ink-soft); overflow-wrap: anywhere; }
.bp-flag .bp-next { margin-top: 0.35rem; font-family: var(--ui); font-size: 0.9375rem; color: var(--ink); }

.bp-clinician { margin-top: 1.5rem; max-width: 46rem; font-size: 1rem; color: var(--ink-soft); }

.hr-section { border-top: 1px solid var(--rule); padding: clamp(2.5rem, 6vw, 4rem) 0; }
.hr-sources { font-family: var(--ui); font-size: 0.875rem; color: var(--ink-soft); max-width: 46rem; }
.hr-sources ul { margin: 0.5rem 0 0; padding-left: 1.1rem; }
.hr-sources li { margin-top: 0.25rem; }
.hr-sources a { overflow-wrap: anywhere; }
.hr-footer { border-top: 1px solid var(--rule); padding: 1.5rem 0 2rem; color: var(--ink-soft); }

@page { size: letter portrait; margin: 12mm 14mm; }

      <p class="bp-hint" data-t="formHint"></p>

    </div>
  </section>
</main>

      eobKicker: "Después de la visita", eobTitle: "¿Le cobraron atención preventiva?", eobSub: "Pegue el texto de su Explicación de Beneficios (EOB) o de una factura. La página busca servicios preventivos con un cobro al lado. Solo texto; nada se sube, se guarda ni se envía a ningún lugar.",

      eobNone: "No se encontró ningún servicio preventivo con un cobro al lado. Si una línea igual le parece incorrecta, llame al número de servicios para miembros de su tarjeta.",
      eobFlag: "Parece atención preventiva con un cobro", eobMaybe: "Atención preventiva con un monto cerca; revise esta línea",
      eobNext: "Llame al número de servicios para miembros de su tarjeta y pida que vuelvan a procesar el reclamo como atención preventiva. Las visitas y pruebas preventivas de este pase no deberían tener copago con Medical Assistance ni con MinnesotaCare.",
      eobHint: "Un primer borrador: lee texto simple y puede omitir cosas o marcar la línea equivocada. No lee PDF ni fotos, a propósito.",
      sourcesLead: "Fuentes.", sources: "Cada línea del pase viene de data.json, una copia de data/measures/mn-medicaid.json en el repositorio de Herada: páginas públicas del DHS y MHCP de Minnesota, el Grupo de Trabajo de Servicios Preventivos de EE. UU. (USPSTF), las guías de servicios preventivos para mujeres de HRSA y healthcare.gov, cada una con la fecha en que se verificó.",
      asOf: "Al {asof}. Borrador compilado por Herada; pendiente de revisión clínica y de calidad del plan. Información general, no un consejo médico para ninguna persona en particular.",
      footer: "Una página de Herada. Borrador, pendiente de revisión clínica y de calidad del plan. No es consejo médico. Fundadora única. Evidencia publicada, nunca vendida. Nada de lo que escriba sale de su dispositivo (privacidad).",
      loadErr: "No se pudieron cargar las reglas de cobertura. Recargue la página o vuelva más tarde.",
      months: ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"]
    }
  };
  var lang = (navigator.language || "").toLowerCase().indexOf("es") === 0 ? "es" : "en";
  var DATA = null;
  var last = { age: 42, state: "MN", plan: "ma", unsure: false };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function t(k, vars) {
    var s = (T[lang] && T[lang][k]) != null ? T[lang][k] : (T.en[k] || "");
    if (vars) Object.keys(vars).forEach(function (v) { s = s.replace("{" + v + "}", vars[v]); });
    return s;
  }
  function L(obj, key) { var v = obj[key + "_" + lang]; return (v == null || v === "") ? (obj[key + "_en"] || "") : v; }
  function fmtDate(d) { return lang === "es" ? d.getDate() + " de " + t("months")[d.getMonth()] + " de " + d.getFullYear() : t("months")[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); }
  function fmtAsOf(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ""); if (!m) return iso || ""; return fmtDate(new Date(+m[1], +m[2] - 1, +m[3])); }
  function monthYear(iso) { var m = /^(\d{4})-(\d{2})/.exec(iso || ""); if (!m) return iso || ""; return t("months")[+m[2] - 1] + " " + m[1]; }

  function applyStrings() {
    document.documentElement.lang = lang;
    Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function (el) {
      var k = el.getAttribute("data-t");
      if (k === "footer") {
        var f = t("footer"); var word = lang === "es" ? "privacidad" : "privacy";
        el.innerHTML = esc(f).replace("(" + word + ")", '(<a href="/privacy/">' + word + "</a>)");
      } else el.textContent = t(k);
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-t-opt]"), function (el) { el.textContent = t(el.getAttribute("data-t-opt")); });
    Array.prototype.forEach.call(document.querySelectorAll(".bp-lang button"), function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false"); });
    document.getElementById("passTitle").textContent = t("passTitle");
    document.getElementById("passSub").textContent = t("passSub");
    fillPlans();
  }
  function fillPlans() {
    var sel = document.getElementById("plan"); var cur = sel.value || last.plan;
    sel.innerHTML = "";
    (DATA && DATA.plan_types ? DATA.plan_types : [{ id: "ma", name_en: "Medical Assistance (Minnesota’s Medicaid)", name_es: "Medical Assistance (el Medicaid de Minnesota)" }, { id: "mncare", name_en: "MinnesotaCare", name_es: "MinnesotaCare" }]).forEach(function (p) {
      var o = document.createElement("option"); o.value = p.id; o.textContent = L(p, "name"); sel.appendChild(o);
    });
    var u = document.createElement("option"); u.value = "unsure"; u.textContent = t("unsure"); sel.appendChild(u);
    sel.value = cur; if (!sel.value) sel.value = "ma";
  }

  // Which lines a woman of this age, on this plan, is owed. No health questions are asked:
  // services with conditions render under "if this is you" instead.
  function fits(s, age, plan) {
    if (s.applies_to && s.applies_to !== "women" && s.applies_to !== "all") return false;
    if (s.age_min != null && age < s.age_min) return false;
    if (s.age_max != null && age > s.age_max) return false;
    if (s.plan_types && s.plan_types.length && s.plan_types.indexOf(plan) < 0) return false;
    return true;
  }
  function placement(s) {
    if (s.placement) return s.placement;
    if (s.conditions && s.conditions.length) return "conditional";
    return "headline";
  }
  function itemHtml(s, compact) {
    var src = (s.basis || []).filter(function (b) { return b && b.url; });
    var srcHtml = src.length ? '<span class="bp-src">' + esc(t("source")) + ": " + src.map(function (b) { return '<a href="' + esc(b.url) + '">' + esc(b.title || b.type) + "</a>"; }).join("; ") + (src[0].checked ? " · " + esc(t("checked")) + " " + esc(monthYear(src[0].checked)) : "") + "</span>" : "";
    var say = L(s, "say");
    var sayHtml = '<p class="bp-say"><b>' + esc(L(s, "free") || t("free")) + "</b> · " + esc(t("say")) + " <q>" + esc(say) + "</q></p>";
    if (compact) return "<li><b>" + esc(L(s, "name")) + '</b> <span class="bp-when">' + esc(L(s, "interval")) + "</span>" + sayHtml + srcHtml + "</li>";
    return '<li><div class="bp-item-head"><b>' + esc(L(s, "name")) + '</b><span class="bp-when">' + esc(L(s, "interval")) + "</span></div>" +
      '<p class="bp-what">' + esc(L(s, "what_happens")) + "</p>" + sayHtml + srcHtml + "</li>";
  }
  function render() {
    var el = document.getElementById("pass");
    if (!DATA) { el.innerHTML = '<p class="bp-empty">' + esc(t("loadErr")) + "</p>"; return; }
    var age = last.age, plan = last.plan;
    var head = [], also = [], cond = [];
    (DATA.services || []).forEach(function (s) {
      if (!fits(s, age, plan)) return;
      var p = placement(s);
      if (p === "conditional") cond.push(s); else if (p === "checkup") also.push(s); else head.push(s);
    });
    // Four to six headline lines; anything beyond six joins the checkup list.
    while (head.length > 6) also.unshift(head.pop());
    var planObj = (DATA.plan_types || []).filter(function (p) { return p.id === plan; })[0];
    var now = new Date(), year = now.getFullYear();
    var html = '<article class="bp-pass" aria-label="' + esc(t("bandKick")) + '">' +
      '<div class="bp-band"><p class="bp-kick">' + esc(t("bandKick")) + "</p><h2>" + esc(t("bandTitle", { year: year })) + "</h2>" +
      '<div class="bp-meta"><div><span>' + esc(t("passenger")) + "</span><b>" + esc(t("passengerVal", { age: age })) + "</b></div>" +
      "<div><span>" + esc(t("from")) + "</span><b>Minnesota</b></div>" +
      "<div><span>" + esc(t("planLabel")) + "</span><b>" + esc(planObj ? (L(planObj, "short_name") || L(planObj, "name")) : plan) + "</b></div>" +
      "<div><span>" + esc(t("valid")) + "</span><b>" + esc(t("validVal", { year: year })) + "</b></div>" +
      "<div><span>" + esc(t("issued")) + "</span><b>" + esc(fmtDate(now)) + "</b></div></div></div>" +
      '<div class="bp-body">';
    if (!head.length && !also.length && !cond.length) html += '<p class="bp-empty">' + esc(t("empty")) + "</p>";
    if (head.length) html += '<div class="bp-group"><h3>' + esc(t("thisYear")) + '</h3><ul class="bp-items">' + head.map(function (s) { return itemHtml(s, false); }).join("") + "</ul></div>";
    if (also.length) html += '<div class="bp-group"><h3>' + esc(t("atCheckup")) + '</h3><ul class="bp-also">' + also.map(function (s) { return itemHtml(s, true); }).join("") + "</ul></div>";
    if (cond.length) html += '<div class="bp-group"><h3>' + esc(t("ifYou")) + '</h3><ul class="bp-also">' + cond.map(function (s) { return itemHtml(s, true); }).join("") + "</ul></div>";
    html += '<p class="bp-foot">' + esc(t("foot")) + "</p></div></article>";
    el.innerHTML = html;
    var note = document.getElementById("planNote");
    var bits = [];
    if (last.unsure) bits.push(esc(t("planUnsureNote")));
    if (planObj) { if (L(planObj, "preventive_cost_sharing")) bits.push("<b>" + esc(L(planObj, "name")) + ".</b> " + esc(L(planObj, "preventive_cost_sharing"))); if (L(planObj, "managed_care_note")) bits.push(esc(L(planObj, "managed_care_note"))); }
    note.innerHTML = bits.join(" "); note.style.display = bits.length ? "" : "none";
    renderSources();
  }
  function renderSources() {
    var ul = document.getElementById("sourceList"); ul.innerHTML = "";
    if (!DATA) return;
    (DATA.sources_checked || []).forEach(function (s) {
      var li = document.createElement("li"); li.innerHTML = '<a href="' + esc(s.url) + '">' + esc(s.title) + "</a>" + (s.checked ? " (" + esc(t("checked")) + " " + esc(fmtAsOf(s.checked)) + ")" : ""); ul.appendChild(li);
    });
    document.getElementById("asOf").textContent = t("asOf", { asof: fmtAsOf(DATA.as_of) });
  }

  // The EOB reader. Plain text in, a short list out, nothing kept.
  var owes = /(you owe|you pay|your (cost|share|responsibility)|patient (responsibility|owes|balance|pays)|member (responsibility|owes|pays)|amount (you|patient|member) (owe|pay)s?|balance due|copay|co-pay|coinsurance|co-insurance|deductible|usted (debe|paga)|su (parte|costo|responsabilidad)|monto que (usted )?debe|saldo|copago|coseguro|deducible)/i;
  var money = /\$\s?\d{1,3}(?:,\d{3})*(?:\.\d{2})?|\b\d{1,3}(?:,\d{3})*\.\d{2}\b/g;
  function allAmounts(str) {
    var re = new RegExp(money.source, "g"), x, out = [];
    while ((x = re.exec(str))) out.push({ i: x.index, v: parseFloat(x[0].replace(/[^0-9.]/g, "")) || 0, raw: x[0] });
    return out;
  }
  // The amount she is asked to pay: the first amount after an "owe" word, else the last amount on the line.
  function patientAmount(str) {
    var amts = allAmounts(str); if (!amts.length) return null;
    var m = owes.exec(str);
    if (m) { var after = amts.filter(function (a) { return a.i > m.index; }); if (after.length) return after[0]; }
    return amts[amts.length - 1];
  }
  function eobCheck() {
    var out = document.getElementById("eobOut");
    var text = document.getElementById("eob").value || "";
    if (!text.trim()) { out.innerHTML = '<p class="bp-hint">' + esc(t("eobEmpty")) + "</p>"; return; }
    var codes = {}, words = [];
    (DATA && DATA.services || []).forEach(function (s) {
      (s.cpt_hints || []).forEach(function (c) { codes[String(c).toUpperCase()] = s; });
      var nm = L(s, "name").toLowerCase(); if (nm) words.push([nm, s]);
      (s.keywords || []).forEach(function (k) { words.push([String(k).toLowerCase(), s]); });
    });
    var generic = ["preventive", "preventative", "well woman", "well-woman", "wellness", "annual exam", "annual physical", "screening", "mammogram", "mammography", "pap", "cervical", "hpv", "chlamydia", "colonoscopy", "cologuard", "fit test", "immunization", "vaccine", "flu shot", "prophylaxis", "dental exam", "eye exam", "preventivo", "preventiva", "mamografía", "papanicolaou", "vacuna", "examen anual", "chequeo"];
    var lines = text.split(/\r?\n/);
    var flags = [];
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i]; var low = line.toLowerCase();
      if (!low.trim()) continue;
      var hit = null;
      var m = low.match(/\b(\d{5}|[a-z]\d{4})\b/g);
      if (m) for (var j = 0; j < m.length && !hit; j++) if (codes[m[j].toUpperCase()]) hit = codes[m[j].toUpperCase()];
      if (!hit) for (var k = 0; k < words.length && !hit; k++) if (words[k][0] && low.indexOf(words[k][0]) >= 0) hit = words[k][1];
      var gen = !hit && generic.some(function (g) { return low.indexOf(g) >= 0; });
      if (!hit && !gen) continue;
      // Amounts on this line; the next line only when this one has none (tables often wrap).
      var scope = money.test(line) ? line : line + " " + (lines[i + 1] || "");
      money.lastIndex = 0;
      var amt = patientAmount(scope);
      if (!amt) continue;
      var anyPositive = allAmounts(scope).some(function (a) { return a.v > 0; });
      if (!anyPositive) continue;
      var strong = owes.test(scope) && amt.v > 0;
      flags.push({ strong: strong, name: hit ? L(hit, "name") : null, line: line.trim(), amt: amt.raw });
      if (flags.length >= 20) break;
    }
    if (!flags.length) { out.innerHTML = '<p class="bp-flag">' + esc(t("eobNone")) + "</p>"; return; }
    out.innerHTML = flags.map(function (f) {
      return '<div class="bp-flag"><span class="bp-tag' + (f.strong ? "" : " soft") + '">' + esc(f.strong ? t("eobFlag") : t("eobMaybe")) + "</span>" +
        (f.name ? "<b>" + esc(f.name) + "</b> " : "") + (f.amt ? "<b>" + esc(f.amt) + "</b>" : "") +
        '<span class="bp-line">' + esc(f.line.slice(0, 180)) + "</span>" +
        (f.strong ? '<p class="bp-next">' + esc(t("eobNext")) + "</p>" : "") + "</div>";
    }).join("");
  }

  // Wiring
  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var err = document.getElementById("err"); err.className = "bp-err";
    var age = parseInt(document.getElementById("age").value, 10);
    var state = document.getElementById("state").value;
    var plan = document.getElementById("plan").value;
    if (!(age >= 18 && age <= 120)) { err.textContent = t("errAge"); err.className = "bp-err show"; return; }
    if (state !== "MN") { err.textContent = t("errState"); err.className = "bp-err show"; return; }
    last = { age: age, state: state, plan: plan === "unsure" ? "ma" : plan, unsure: plan === "unsure" };
    render();
    document.getElementById("passsec").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".bp-lang button"), function (b) {
    b.addEventListener("click", function () { lang = b.getAttribute("data-lang"); applyStrings(); render(); var o = document.getElementById("eobOut"); if (o.innerHTML) eobCheck(); });
  });
  document.getElementById("printBtn").addEventListener("click", function () { window.print(); });
  document.getElementById("eobBtn").addEventListener("click", eobCheck);
  document.getElementById("eobClear").addEventListener("click", function () { document.getElementById("eob").value = ""; document.getElementById("eobOut").innerHTML = ""; });

  document.getElementById("age").value = last.age;
  applyStrings();
  render();
  fetch("data.json", { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) {
    DATA = d; fillPlans(); render();
  }).catch(function () { DATA = null; render(); });
})();
