# Builds the public site and deploys it to GitHub Pages on every push to main.
# The site is plain HTML and CSS, so "build" just means copying folders:
#   site/                      -> /
#   projects/<name>/public/    -> /projects/<name>/
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          for dir in projects/*/public; do
            [ -d "$dir" ] || continue
            name=$(basename "$(dirname "$dir")")
            case "$name" in _*) continue ;; esac
            mkdir -p "_site/projects/$name"
            cp -r "$dir/." "_site/projects/$name/"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
