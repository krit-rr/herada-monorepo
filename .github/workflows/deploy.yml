# Publishes the site to GitHub Pages on every push to main.
# The site is plain HTML and CSS, so "build" just means copying folders:
#   site/                      -> /
#   projects/<name>/public/    -> /projects/<name>/
# then listing those pages in a sitemap and checking the internal links.
# Those steps are a few lines of shell and Python in tools/qa, shared with
# the QA workflow that runs on pull requests. Not a build tool.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, so the sitemap can date each page from its last commit.
          fetch-depth: 0

      - id: pages
        uses: actions/configure-pages@v6

      - name: Assemble site
        run: bash tools/qa/assemble.sh _site

      - name: Write sitemap.xml
        # One <url> per index.html in _site, dated by the last commit that
        # touched its source file. 404.html is left out on purpose, and so is
        # any page that carries a robots noindex tag: those deploy, and can be
        # shared by address, but are not announced to search engines.
        run: |
          bash tools/qa/sitemap.sh _site
          cat _site/sitemap.xml

      - name: Check internal links
        # Fails the deploy if any href, src or CSS url() points at a file that
        # is not in _site. External links, mailto, tel, data URIs, bare anchors
        # and the contents of <script> blocks are skipped.
        run: python3 tools/qa/linkcheck.py _site

      - name: Prefix root paths when Pages serves the site under /<repo>/
        # Until joinherada.com is the Pages domain, the site lives at
        # krit-rr.github.io/herada-monorepo/ and configure-pages reports that
        # base path; the pages link from the root, so the prefix is added to the
        # assembled copy only. With the custom domain set, base_path is empty
        # and this step changes nothing. It runs after the link check so the
        # check still sees root paths.
        run: bash tools/qa/prefix.sh _site "${{ steps.pages.outputs.base_path }}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
